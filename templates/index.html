<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c1210" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>贪恐 GreedFear</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>

  <header class="top">
    <div class="brand">
      <span class="brand-mark">贪恐</span>
      <span class="brand-en">GreedFear</span>
    </div>
    <div class="market-switch" role="tablist" aria-label="市场">
      <button class="mkt is-active" data-market="US" role="tab" aria-selected="true">美股</button>
      <button class="mkt" data-market="HK" role="tab" aria-selected="false">港股</button>
    </div>
  </header>

  <main>
    <section class="hero" aria-live="polite">
      <p class="eyebrow" id="source-line">加载中…</p>
      <div class="gauge-wrap">
        <svg class="gauge" viewBox="0 0 240 150" role="img" aria-label="贪恐指数表盘">
          <defs>
            <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#3ec7ff" />
              <stop offset="45%" stop-color="#8fd9a8" />
              <stop offset="70%" stop-color="#d4e36a" />
              <stop offset="100%" stop-color="#ffb347" />
            </linearGradient>
          </defs>
          <path class="gauge-track" d="M 28 130 A 92 92 0 0 1 212 130" />
          <path class="gauge-value" id="gauge-arc" d="M 28 130 A 92 92 0 0 1 212 130" />
          <line class="needle" id="needle" x1="120" y1="130" x2="120" y2="48" />
          <circle class="hub" cx="120" cy="130" r="6" />
        </svg>
        <div class="score-block">
          <div class="score" id="score">—</div>
          <div class="level" id="level">—</div>
        </div>
      </div>
      <p class="lede" id="lede">合成多因子情绪，辅助判断过热与恐慌。</p>
    </section>

    <section class="spark" aria-label="近月走势">
      <div class="section-head">
        <h2>近月走势</h2>
        <span id="updated">—</span>
      </div>
      <canvas id="spark" width="640" height="160"></canvas>
    </section>

    <section class="factors" aria-label="分项因子">
      <div class="section-head">
        <h2>分项因子</h2>
      </div>
      <ul class="factor-list" id="factors"></ul>
    </section>

    <section class="phone-hint" id="phone-hint">
      <div class="section-head">
        <h2>手机打开</h2>
      </div>
      <p class="hint-text">同一 Wi-Fi 下扫码，或浏览器访问：</p>
      <p class="phone-url" id="phone-url">http://{{ lan_ip }}:{{ port }}</p>
      <img class="qr" id="qr" alt="手机访问二维码" src="/api/qr.png?port={{ port }}" />
      <p class="hint-sub">可「添加到主屏幕」当小工具用。电脑需保持本服务运行。</p>
    </section>
  </main>

  <footer class="foot">
    <button type="button" class="refresh" id="refresh">刷新</button>
  </footer>

  <nav class="bottom-nav">
    <a href="/" class="nav-item is-active">市场</a>
    <a href="/etf" class="nav-item">贪恐</a>
  </nav>

  <script src="/static/app.js"></script>
</body>
</html>
