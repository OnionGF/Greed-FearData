<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>贪恐指数 · ETF</title>
  <link rel="stylesheet" href="/static/etf.css" />
</head>
<body>
  <main class="etf" id="app">
    <header class="header">
      <div class="header-top">
        <div class="title">贪恐指数</div>
        <div class="header-actions">
          <div class="date-time" id="updated">—</div>
        </div>
      </div>
      <div class="overview">
        <div class="notice">
          <div class="fear-greed-rule">
            <div class="fear-greed-bar">
              <span class="fear-threshold"></span>
              <span class="greed-threshold"></span>
            </div>
            <div class="fear-greed-scale">
              <span class="fg-start">-100</span>
              <span class="fg-fear" id="stat-fear">恐慌0个</span>
              <span class="fg-fear-threshold">-60</span>
              <span class="fg-neutral" id="stat-neutral">中性0个</span>
              <span class="fg-greed-threshold">60</span>
              <span class="fg-greed" id="stat-greed">贪婪0个</span>
              <span class="fg-end">100</span>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="tabs" role="tablist" id="tabs"></div>

    <section class="content">
      <div class="table-wrap">
        <table class="etf-table">
          <thead>
            <tr class="table-header-row">
              <th data-sort="code">代码</th>
              <th data-sort="name">名称</th>
              <th data-sort="score">贪恐</th>
              <th data-sort="price">市价</th>
              <th data-sort="scale">规模</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="5" class="empty">加载中...</td></tr>
          </tbody>
        </table>
      </div>
      <p class="footnote" id="footnote">≥60 情绪贪婪，≤-60 情绪恐慌。仅供参考，不构成投资建议。</p>
    </section>
  </main>

  <nav class="bottom-nav">
    <a href="/" class="nav-item">市场</a>
    <a href="/etf" class="nav-item is-active">贪恐</a>
  </nav>

  <script src="/static/etf.js"></script>
</body>
</html>
